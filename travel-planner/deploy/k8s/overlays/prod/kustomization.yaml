apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: travel-planner-prod
namePrefix: prod-

replicas:
  - name: travel-planner
    count: 3

patches:
  - target:
      kind: Deployment
      name: travel-planner
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
