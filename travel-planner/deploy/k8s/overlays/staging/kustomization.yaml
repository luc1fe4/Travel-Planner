apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: travel-planner-staging
namePrefix: staging-

replicas:
  - name: travel-planner
    count: 2

patches:
  - target:
      kind: Deployment
      name: travel-planner
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
