apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-planner
  labels:
    app: travel-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-planner
  template:
    metadata:
      labels:
        app: travel-planner
    spec:
      containers:
        - name: travel-planner
          image: travel-planner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /v3/api-docs
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v3/api-docs
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
